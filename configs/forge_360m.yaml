model:
  arch: forge
  vocab_size: 50304
  d_model: 960
  n_layers: 32
  n_heads: 15
  n_kv_heads: 5
  context_length: 2048

data:
  data_dir: data/fineweb_edu
  seq_len: 256

train:
  micro_batch_size: 16
  grad_accum_steps: 4
  max_lr: 3.0e-4
  min_lr: 3.0e-5
  warmup_steps: 2000
  max_steps: 50000
  weight_decay: 0.1
  dtype: bfloat16
